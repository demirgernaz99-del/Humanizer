<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zugradar – Vorschaubild</title>
<!-- Vorlage für icons/og-image.png (1200×630). Wird von tools/screenshots.js fotografiert. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../src/pieces.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(900px 500px at 85% 20%, #1d2a27 0%, #111416 60%); color: #e8ebe6;
         font-family: "IBM Plex Sans", system-ui, sans-serif; display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center; padding: 0 72px; box-sizing: border-box; }
  .brand { font: 800 34px/1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.02em; display: flex; align-items: center; gap: 14px; }
  .brand i { font: 600 15px/1 "IBM Plex Mono", monospace; font-style: normal; color: #d9a646; border: 1px solid #d9a646; border-radius: 999px; padding: 6px 11px; letter-spacing: .02em; }
  h1 { font: 800 60px/1.04 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.025em; margin: 34px 0 22px; }
  h1 em { font-style: normal; color: #2cc4b4; }
  p { font-size: 24px; line-height: 1.4; color: #b6bdb7; margin: 0; }
  .chips { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .chips span { display: inline-flex; align-items: center; gap: 8px; background: #1b2022; border: 1px solid #2c3336; border-radius: 999px; padding: 8px 14px; font-size: 17px; color: #e8ebe6; }
  .chips b { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; color: #fff; letter-spacing: -.04em; }
  .board { position: relative; width: 470px; height: 470px; display: grid; grid-template-columns: repeat(8, 1fr); border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .s { position: relative; } .s.l { background: #ece7d1; } .s.d { background: #7b936b; }
  .s.hl::before { content: ""; position: absolute; inset: 0; background: #13a598; opacity: .5; }
  .pc { position: absolute; inset: 0; background-size: 100% 100%; }
  .badge { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: #13a598; border: 4px solid #fff; color: #fff; display: grid; place-items: center;
           font: 800 21px/1 "IBM Plex Sans", sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
</style>
</head>
<body>
  <div>
    <div class="brand">Zugradar <i>Stockfish 18</i></div>
    <h1>Jeder Zug sofort bewertet. <em>Brillant</em> erkannt.</h1>
    <p>Bester Zug live, Coach in Klartext, Insights und ein Trainer aus deinen eigenen Fehlern – direkt im Browser.</p>
    <div class="chips">
      <span><b style="background:#13a598">!!</b>Brillant</span>
      <span><b style="background:#4a82c4">!</b>Großartig</span>
      <span><b style="background:#5a9a36">★</b>Bester Zug</span>
      <span><b style="background:#c9302c">??</b>Patzer</span>
    </div>
  </div>
  <div class="board" id="b"></div>
<script>
  // Kasparow – Topalow 1999 nach 24.Txd4!!
  var fen = 'b2r3r/k4p1p/p2q1np1/NppP4/3R1Q2/P4PPB/1PP4P/1K2R3', b = document.getElementById('b'), rows = fen.split('/'), html = '';
  for (var r = 0; r < 8; r++) {
    var f = 0;
    for (var i = 0; i < rows[r].length; i++) {
      var ch = rows[r][i];
      if (/\d/.test(ch)) { for (var k = 0; k < +ch; k++, f++) html += '<div class="s ' + ((r + f) % 2 ? 'd' : 'l') + (r === 4 && f === 3 ? ' hl' : '') + '"></div>'; continue; }
      var pc = (ch === ch.toUpperCase() ? 'w' : 'b') + ch.toLowerCase();
      html += '<div class="s ' + ((r + f) % 2 ? 'd' : 'l') + (r === 4 && f === 3 ? ' hl' : '') + '"><div class="pc ' + pc + '"></div></div>';
      f++;
    }
  }
  b.innerHTML = html + '<div class="badge" style="left:' + (4 * 58.75 - 34) + 'px;top:' + (4 * 58.75 - 16) + 'px">!!</div>';
</script>
</body>
</html>
