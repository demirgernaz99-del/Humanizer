{% extends "base.html" %}
{% block title %}Registrieren – {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Konto erstellen</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>E-Mail<input type="email" name="email" required autofocus></label>
    <label>Passwort (min. 8 Zeichen)<input type="password" name="password" minlength="8" required></label>
    <button class="btn btn-primary">Kostenlos registrieren</button>
  </form>
  <p class="muted">Mit der Registrierung akzeptierst du die <a href="/legal">AGB und den Risikohinweis</a>.</p>
  <p class="muted">Schon ein Konto? <a href="/login">Login</a></p>
</div>
{% endblock %}
